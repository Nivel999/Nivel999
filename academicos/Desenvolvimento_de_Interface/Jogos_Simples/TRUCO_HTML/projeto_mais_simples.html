<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truco 12 Pontos - Simplificado</title>
    <style>



        /* Modelo CSS */


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
            font-weight: bold;
            user-select: none;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .game-container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: radial-gradient(circle, #1b4d3e 40%, #0f3026 100%);
            border: 8px solid #2c1a04;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
        }

        .points {
            font-size: 1.8rem;
            color: #ffb74d;
        }

        .poker-table {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-seat {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .seat-top {
            top: 0;
        }

        .seat-left {
            left: 0;
        }

        .seat-right {
            right: 0;
        }

        .seat-bottom {
            bottom: 0;
        }

        .player-label {
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .hand-slots {
            display: flex;
            gap: 4px;
        }

        .card {
            width: 65px;
            height: 90px;
            background: #fff;
            color: #2c3e50;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            cursor: pointer;
            border: 2px solid #ccc;
            text-align: center;
        }

        .card.c-red {
            color: #c0392b;
        }

        .card.c-joker {
            color: #8e44ad;
            border-color: #8e44ad;
        }

        .card.card-back {
            background: #2c3e50;
            color: #2c3e50;
            border: 1px solid #fff;
        }

        .center-arena {
            width: 160px;
            height: 160px;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .played-card-slot {
            position: absolute;
            width: 55px;
            height: 75px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot-top {
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .slot-bottom {
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .slot-left {
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
        }

        .slot-right {
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
        }

        .action-bar {
            display: flex;
            justify-content: center;
            padding: 5px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 1rem;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <!--  SETOR DE HTML  -->

    <div class="game-container">
        <div class="scoreboard">
            <div>
                <div>Seu Time</div>
                <div class="points" id="score-t1">0</div>
            </div>
            <div>
                <div id="match-value">VALENDO 1 PONTO</div>
                <div id="info-log" style="color: #ffeb3b; font-size: 0.9rem;">Sua vez!</div>
            </div>
            <div>
                <div>Adversários</div>
                <div class="points" id="score-t2">0</div>
            </div>
        </div>

        <div class="poker-table">
            <div class="player-seat seat-top">
                <div class="player-label">Parceiro</div>
                <div class="hand-slots" id="hand-2"></div>
            </div>
            <div class="player-seat seat-right">
                <div class="player-label">Oponente 1</div>
                <div class="hand-slots" id="hand-1"></div>
            </div>
            <div class="player-seat seat-left">
                <div class="player-label">Oponente 2</div>
                <div class="hand-slots" id="hand-3"></div>
            </div>
            <div class="player-seat seat-bottom">
                <div class="hand-slots" id="hand-0"></div>
                <div class="player-label">Você</div>
            </div>

            <div class="center-arena">
                <div class="played-card-slot slot-top" id="play-slot-2"></div>
                <div class="played-card-slot slot-right" id="play-slot-1"></div>
                <div class="played-card-slot slot-left" id="play-slot-3"></div>
                <div class="played-card-slot slot-bottom" id="play-slot-0"></div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn" id="btn-truco" onclick="pedirTruco()">PEDIR TRUCO</button>
        </div>
    </div>

    <script>


        //Modelo JavaScript



        const POWERS = { '4 PAUS': 100, '7 CORACAO': 99, 'A ESPADA': 98, '7 OURO': 97, 'JOKER': 50, '3': 15, '2': 14, 'A': 13, 'K': 12, 'J': 11, 'Q': 10 };
        let state = { s1: 0, s2: 0, val: 1, hand: 0, hands: [], played: [], winners: [], turn: 0, dealer: 0 };

        function buildDeck() {
            let d = [];
            ['Q', 'J', 'K', 'A', '2', '3'].forEach(r => {
                d.push({ t: r, c: 'c-black' }, { t: r, c: 'c-red' }, { t: r, c: 'c-black' }, { t: r, c: 'c-red' });
            });
            d.push({ t: '4 PAUS', c: 'c-black' }, { t: '7 CORACAO', c: 'c-red' }, { t: 'A ESPADA', c: 'c-black' }, { t: '7 OURO', c: 'c-red' }, { t: 'JOKER', c: 'c-joker' }, { t: 'JOKER', c: 'c-joker' });
            return d.sort(() => Math.random() - 0.5);
        }

        function startHand() {
            state.played = []; state.winners = []; state.val = 1;
            state.dealer = (state.dealer + 1) % 4; state.turn = (state.dealer + 1) % 4;
            let deck = buildDeck();
            state.hands = Array.from({ length: 4 }, () => [deck.pop(), deck.pop(), deck.pop()]);
            document.querySelectorAll('.played-card-slot').forEach(s => s.innerHTML = '');
            document.getElementById('info-log').innerText = "Nova rodada iniciada.";
            render();
            if (state.turn !== 0) setTimeout(botTurn, 600);
        }

        function render() {
            document.getElementById('score-t1').innerText = state.s1;
            document.getElementById('score-t2').innerText = state.s2;
            document.getElementById('match-value').innerText = `VALENDO ${state.val} PONTO(S)`;

            const hand0 = document.getElementById('hand-0'); hand0.innerHTML = '';
            state.hands[0].forEach((card, idx) => {
                let div = document.createElement('div');
                div.className = `card ${card.c}`; div.innerText = card.t;
                div.onclick = () => playCard(0, idx);
                hand0.appendChild(div);
            });

            for (let i = 1; i <= 3; i++) {
                const h = document.getElementById(`hand-${i}`); h.innerHTML = '';
                state.hands[i].forEach(() => {
                    let div = document.createElement('div'); div.className = 'card card-back'; div.innerText = '?';
                    h.appendChild(div);
                });
            }
            document.getElementById('btn-truco').disabled = state.val >= 12 || state.turn !== 0;
        }

        function playCard(pId, idx) {
            if (state.turn !== pId) return;
            let card = state.hands[pId].splice(idx, 1)[0];
            state.played.push({ pId, card, team: pId % 2 === 0 ? 1 : 2 });
            document.getElementById(`play-slot-${pId}`).innerHTML = `<div class="card ${card.c}">${card.t}</div>`;
            state.turn = (state.turn + 1) % 4;
            render();
            setTimeout(evaluate, 600);
        }

        function botTurn() {
            if (state.turn === 0) return;
            playCard(state.turn, 0);
        }

        function evaluate() {
            if (state.played.length < 4) { botTurn(); return; }
            let best = state.played[0], tie = false;
            for (let i = 1; i < 4; i++) {
                let p1 = POWERS[state.played[i].card.t], p2 = POWERS[best.card.t];
                if (p1 > p2) { best = state.played[i]; tie = false; }
                else if (p1 === p2 && state.played[i].team !== best.team) tie = true;
            }

            let wTeam = tie ? 'tie' : best.team;
            state.winners.push(wTeam);
            state.played = [];
            if (!tie) state.turn = best.pId;

            document.querySelectorAll('.played-card-slot').forEach(s => s.innerHTML = '');
            document.getElementById('info-log').innerText = tie ? "Empatou a vaza!" : `Time ${wTeam === 1 ? 'Seu' : 'Adversário'} levou a vaza.`;

            let hWin = checkWin();
            if (hWin) {
                if (hWin === 1) state.s1 += state.val; else state.s2 += state.val;
                alert(hWin === 1 ? `Seu time ganhou +${state.val} ponto(s)!` : `Adversários ganharam +${state.val} ponto(s)!`);
                if (state.s1 >= 12 || state.s2 >= 12) {
                    alert(state.s1 >= 12 ? "FIM DE JOGO! SEU TIME VENCEU! 🏆" : "FIM DE JOGO! VITÓRIA DOS BOTS! 🤖");
                    state.s1 = 0; state.s2 = 0;
                }
                startHand();
            } else {
                render();
                if (state.turn !== 0) setTimeout(botTurn, 600);
            }
        }

        function checkWin() {
            const w = state.winners, t1 = w.filter(x => x === 1).length, t2 = w.filter(x => x === 2).length;
            if (t1 === 2) return 1; if (t2 === 2) return 2;
            if (w[0] === 'tie' && w[1] !== 'tie') return w[1];
            if (w[0] !== 'tie' && w[1] === 'tie') return w[0];
            if (w[2] === 'tie' && w[0] !== 'tie') return w[0];
            if (w.length === 3 && w.every(x => x === 'tie')) return state.dealer % 2 === 0 ? 2 : 1;
            return null;
        }

        function pedirTruco() {
            if (state.turn !== 0 || state.val >= 12) return;
            let proximoValor = state.val === 1 ? 3 : state.val + 3;
            if (confirm(`Deseja pedir aumento para ${proximoValor} pontos?`)) {
                if (Math.random() > 0.3) {
                    state.val = proximoValor;
                    alert(`Os adversários aceitaram! A rodada agora vale ${state.val} pontos.`);
                } else {
                    alert("Os adversários correram! Seu time ganha os pontos atuais da mão.");
                    state.s1 += state.val;
                    startHand();
                }
                render();
            }
        }

        window.onload = startHand;
    </script>
</body>

</html>
